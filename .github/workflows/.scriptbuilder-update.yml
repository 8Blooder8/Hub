name: apply ScriptBuilder simplification

on:
  push:
    branches:
      - codex/scriptbuilder-simplification

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update ScriptBuilder.lua
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('ScriptBuilder.lua')
          s = path.read_text(encoding='utf-8')

          # Remove the Remote/Args resolver stack and replace it with a generic
          # Lua snippet environment. Modules execute exactly the code supplied
          # in `Code`, with the current control value available as `value`.
          start = s.index('local function isRemote(value)')
          end_marker = 'local function disconnectAll(list)'
          end = s.index(end_marker, start)
          execution_helpers = r'''local function getGlobalEnv()
              if getgenv then
                  local ok, env = pcall(getgenv)
                  if ok and type(env) == "table" then
                      return env
                  end
              end
              return _G
          end

          local function makeCodeEnv(mod, value)
              local env = {
                  game = game,
                  workspace = workspace,
                  Workspace = workspace,
                  Players = Players,
                  ReplicatedStorage = ReplicatedStorage,
                  UserInputService = UserInputService,
                  TweenService = TweenService,
                  Enum = Enum,
                  task = task,
                  math = math,
                  string = string,
                  table = table,
                  typeof = typeof,
                  print = print,
                  warn = warn,
                  module = mod,
                  value = value,
                  Value = value,
                  enabled = mod.Enabled == true,
                  Enabled = mod.Enabled == true,
                  params = mod.Params,
                  Params = mod.Params,
              }

              return setmetatable(env, {__index = getGlobalEnv()})
          end

          local function executeCode(mod, value)
              local code = trim(mod.Code)
              if code == "" then
                  return false, "Code is empty"
              end

              local compiler = loadstring or load
              if not compiler then
                  return false, "loadstring/load is unavailable"
              end

              local fn, compileErr = compiler(code)
              if not fn then
                  return false, compileErr
              end

              local env = makeCodeEnv(mod, value)
              if setfenv then
                  local okEnv, envErr = pcall(setfenv, fn, env)
                  if not okEnv then
                      return false, envErr
                  end
              end

              return pcall(fn)
          end

          '''
          s = s[:start] + execution_helpers + s[end:]

          old_invoke = re.compile(r'''function Builder:_invokeRemote\(mod, extra\).*?\nend\n\nfunction Builder:_fire\(mod, extra\)\n    task\.spawn\(function\(\)\n        self:_invokeRemote\(mod, extra\)\n    end\)\n    return true\nend''', re.S)
          new_invoke = r'''function Builder:_execute(mod, value)
              local ok, result = executeCode(mod, value)
              self.Status = ok and (mod.Name .. ": OK") or (mod.Name .. ": " .. tostring(result))
              self:_updateStatus()
              if not ok then
                  warn("[ScriptBuilder] " .. self.Status)
              end
              return ok, result
          end

          function Builder:_fire(mod, value)
              task.spawn(function()
                  self:_execute(mod, value ~= nil and value or mod.Value)
              end)
              return true
          end'''
          s, n = old_invoke.subn(new_invoke, s, count=1)
          assert n == 1, 'Could not replace remote invocation block'

          s = s.replace('self:_invokeRemote(mod)\n\n            if not mod.Enabled', 'self:_execute(mod, mod.Value)\n\n            if not mod.Enabled', 1)

          old_fields = '''    local control = def.Control or {Type = def.Type or "Toggle"}
    if type(control) == "string" then
        control = {Type = control}
    end
    local mod = {}
    for k,v in pairs(def) do
        mod[k] = v
    end
    mod.Name = name
    mod.Category = category
    mod.Control = control
    mod.Type = tostring(control.Type or "Toggle")
    mod.Args = def.Args or {}
    mod.Options = def.Options or {}
    mod.Enabled = def.Enabled == true
    mod.Value = def.Value
    mod.RemotePath = def.Remote
    mod.Remote = resolveRemote(def.Remote)
    mod.Subcategory = trim(def.Subcategory or def.SubCategory or def.SubcategoryName or "")
    mod.Interval = tonumber(def.Interval)
    mod.UI = {}
    mod._connections = {}
    mod._loopToken = 0
    mod._loopRunning = false'''
          new_fields = '''    local params = type(def.Params) == "table" and def.Params or {}
    local mod = {}
    for k,v in pairs(def) do
        mod[k] = v
    end
    mod.Name = name
    mod.Category = category
    mod.Type = tostring(def.Type or "Button")
    mod.Params = params
    mod.Options = type(params.Options) == "table" and params.Options or {}
    mod.Subcategory = trim(def.Subcategory or "")
    mod.Interval = tonumber(def.Interval)
    mod.Code = tostring(def.Code or "")
    mod.Value = params.Default
    mod.Enabled = mod.Type:lower() == "toggle" and params.Default == true or false
    mod.UI = {}
    mod._connections = {}
    mod._loopToken = 0
    mod._loopRunning = false'''
          assert old_fields in s, 'Could not find AddModule field block'
          s = s.replace(old_fields, new_fields, 1)

          old_warn = '''    if not mod.Remote then
        warn("[ScriptBuilder] " .. name .. ": could not resolve Remote: " .. tostring(def.Remote))
    end
'''
          assert old_warn in s, 'Could not find Remote warning block'
          s = s.replace(old_warn, '    if mod.Code == "" then\n        warn("[ScriptBuilder] " .. name .. ": Code is empty")\n    end\n', 1)

          # Make dropdown/input parameters live entirely under Params.
          s = s.replace('text = tostring(mod.Value or mod.Options[1] or "Select")', 'text = tostring(mod.Value or mod.Options[1] or "Select")')
          s = s.replace('Text = tostring(mod.Placeholder or "Value"),', 'Text = tostring(mod.Params.Placeholder or "Value"),', 1)

          # Insert a real slider control before input/text box handling.
          marker = '    elseif typ == "input" or typ == "textbox" then\n'
          slider = r'''    elseif typ == "slider" then
        local params = mod.Params
        local minValue = tonumber(params.Min) or 0
        local maxValue = tonumber(params.Max) or 100
        local step = math.max(tonumber(params.Step) or 1, 0.000001)
        local value = tonumber(mod.Value) or tonumber(params.Default) or minValue
        value = math.clamp(value, minValue, maxValue)
        mod.Value = value

        local slider = make("Frame", {
            Parent = row,
            Size = UDim2.fromOffset(110,24),
            Position = UDim2.new(1,-121,0.5,-12),
            BackgroundTransparency = 1,
            BorderSizePixel = 0,
        })

        local bar = make("Frame", {
            Parent = slider,
            Size = UDim2.new(1,0,0,4),
            Position = UDim2.new(0,0,0.5,-2),
            BackgroundColor3 = COLORS.ToggleOff,
            BorderSizePixel = 0,
        })
        corner(bar, 2)

        local fill = make("Frame", {
            Parent = bar,
            Size = UDim2.new(0,0,1,0),
            BackgroundColor3 = COLORS.Accent,
            BorderSizePixel = 0,
        })
        corner(fill, 2)

        local knob = make("Frame", {
            Parent = slider,
            Size = UDim2.fromOffset(10,10),
            AnchorPoint = Vector2.new(0.5,0.5),
            BackgroundColor3 = COLORS.Knob,
            BorderSizePixel = 0,
        })
        corner(knob, 5)

        local hit = make("TextButton", {
            Parent = slider,
            Size = UDim2.new(1,0,1,0),
            BackgroundTransparency = 1,
            BorderSizePixel = 0,
            Text = "",
            AutoButtonColor = false,
        })

        local function renderSlider()
            local alpha = (maxValue > minValue)
                and math.clamp((mod.Value - minValue) / (maxValue - minValue), 0, 1)
                or 0
            fill.Size = UDim2.new(alpha,0,1,0)
            knob.Position = UDim2.new(alpha,0,0.5,0)
        end

        local function setSlider(x)
            local width = math.max(slider.AbsoluteSize.X, 1)
            local alpha = math.clamp(
                (x - slider.AbsolutePosition.X) / width,
                0, 1
            )
            local raw = minValue + (maxValue - minValue) * alpha
            local stepped = minValue + math.round((raw - minValue) / step) * step
            mod.Value = math.clamp(stepped, minValue, maxValue)
            renderSlider()
            self:_fire(mod, mod.Value)
        end

        local dragging = false
        table.insert(mod._connections, hit.MouseButton1Down:Connect(function()
            dragging = true
            setSlider(UserInputService:GetMouseLocation().X)
        end))
        table.insert(mod._connections, UserInputService.InputChanged:Connect(function(input)
            if dragging and input.UserInputType == Enum.UserInputType.MouseMovement then
                setSlider(input.Position.X)
            end
        end))
        table.insert(mod._connections, UserInputService.InputEnded:Connect(function(input)
            if input.UserInputType == Enum.UserInputType.MouseButton1 then
                dragging = false
            end
        end))

        mod.UI.Slider = slider
        mod.UI.Fill = fill
        mod.UI.Knob = knob
        renderSlider()

''' + marker
          assert marker in s, 'Could not find input branch marker'
          s = s.replace(marker, slider, 1)

          # FireModule no longer exposes the old Remote/Args mechanism.
          old_fire = '''function Builder:FireModule(name, extra)
    local mod = self.Modules[name]
    if not mod then return false, "Module not found" end
    return self:_invokeRemote(mod, extra)
end
function Builder:AddRemote(name, remote)
    assert(name, "AddRemote: name is required")
    self.Config.Remotes = self.Config.Remotes or {}
    self.Config.Remotes[name] = remote
    return remote
end

function Builder:AddRemoteSpy(callback)
    assert(type(callback) == "function", "AddRemoteSpy expects a function")
    self.Config.RemoteSpy = callback
    return self
end
'''
          new_fire = '''function Builder:FireModule(name, value)
    local mod = self.Modules[name]
    if not mod then return false, "Module not found" end
    if value ~= nil then
        mod.Value = value
    end
    return self:_execute(mod, mod.Value)
end
'''
          assert old_fire in s, 'Could not replace public remote API'
          s = s.replace(old_fire, new_fire, 1)

          # Keep examples/help truthful in the source comments.
          s = s.replace('-- Remote resolver accepts Instances, normal paths and Lua-style expressions.',
                        '-- Modules execute simple Lua snippets supplied through the Code field.')

          path.write_text(s, encoding='utf-8')
          print('Updated ScriptBuilder.lua')
          PY

      - name: Amend commit and push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ScriptBuilder.lua
          git rm -f .github/workflows/.scriptbuilder-update.yml
          git commit --amend --no-edit
          git push --force origin HEAD:codex/scriptbuilder-simplification
